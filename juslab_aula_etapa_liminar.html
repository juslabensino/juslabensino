<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="JusLab Aula sobre a etapa liminar do procedimento comum.">
  <title>Etapa liminar do procedimento comum — JusLab Aula</title>
  <style>
    /* JusLab Art Book — arquivo autossuficiente */
    :root{--ink:#101a1c;--deep:#142326;--paper:#eee5d2;--paper2:#d8cdb8;--teal:#4f8d88;--bronze:#b18a5c;--moss:#708164;--earth:#a65f4e;--white:#f7f2e8;--muted:#b7c1bc;--shadow:0 22px 60px #0008;--serif:"Source Serif 4",Georgia,serif;--sans:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--ink);color:var(--white)}body{font-family:var(--sans);overflow-x:hidden}
    button{font:inherit}.app{min-height:100dvh;display:grid;grid-template-rows:auto 1fr auto;background:radial-gradient(circle at 72% 38%,#264144 0,#142528 38%,#0c1416 75%)}
    .topbar{height:76px;padding:0 clamp(20px,4vw,64px);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff18;z-index:5}.brand{display:flex;align-items:center;gap:12px;font-weight:750;letter-spacing:.02em}.brand-mark{display:grid;place-items:center;width:36px;height:36px;border:1px solid var(--bronze);border-radius:50%;font-family:var(--serif);color:var(--bronze)}.brand small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.16em}.progress{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px}.progress-track{width:min(20vw,220px);height:2px;background:#ffffff1f}.progress-fill{height:100%;background:var(--bronze);transition:width .45s ease}
    main{min-height:0}.scene{min-height:calc(100dvh - 148px);padding:clamp(28px,5vw,72px) clamp(20px,6vw,96px);display:grid;grid-template-columns:minmax(280px,.75fr) minmax(440px,1.25fr);align-items:center;gap:clamp(36px,7vw,120px);animation:enter .45s ease both}.scene--wide{grid-template-columns:minmax(270px,.65fr) minmax(520px,1.35fr)}
    @keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}.eyebrow{color:var(--bronze);font-size:12px;font-weight:750;letter-spacing:.2em;text-transform:uppercase}.copy h1,.copy h2{font-family:var(--serif);font-weight:500;line-height:.98;margin:.35em 0}.copy h1{font-size:clamp(48px,6.5vw,96px)}.copy h2{font-size:clamp(38px,4.5vw,68px)}.copy p{font-family:var(--serif);font-size:clamp(21px,2vw,30px);line-height:1.45;color:#dce1dc;max-width:29em}.legal-note{border-left:2px solid var(--bronze);padding-left:18px;color:var(--muted)!important;font:500 clamp(16px,1.3vw,20px)/1.5 var(--sans)!important}
    .stage{min-height:480px;display:grid;place-items:center;position:relative;isolation:isolate}.desk{position:absolute;inset:3%;border-radius:50%;background:radial-gradient(ellipse,#263b39 0,#142321 60%,transparent 72%);filter:blur(2px)}.document{position:relative;width:min(390px,70%);aspect-ratio:.72;background:linear-gradient(135deg,var(--white),var(--paper));color:#28302e;padding:clamp(28px,4vw,52px);box-shadow:var(--shadow);transform:rotate(-2deg);transition:.5s ease}.document:before{content:"";position:absolute;inset:15px;border:1px solid #8c765b44}.doc-seal{font-family:var(--serif);font-size:clamp(22px,2.4vw,35px);border-bottom:1px solid #927b60;padding-bottom:18px;margin-bottom:25px}.line{height:7px;background:#594e4030;margin:11px 0;border-radius:3px}.line.short{width:62%}.paper-tag{position:absolute;right:-20px;top:28px;background:var(--earth);color:white;padding:10px 15px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;box-shadow:0 8px 20px #0004}.stamp{position:absolute;bottom:15%;right:7%;border:3px double var(--teal);color:#326762;padding:9px 14px;transform:rotate(-7deg);font-weight:800;text-transform:uppercase;letter-spacing:.08em}
    .route{width:min(680px,100%);display:grid;gap:18px;position:relative}.route:before{content:"";position:absolute;left:25px;top:28px;bottom:28px;width:1px;background:#ffffff25}.route-step{display:grid;grid-template-columns:52px 1fr;align-items:center;gap:18px;opacity:0;visibility:hidden;transform:translateX(-8px);transition:.35s}.route-step.open{opacity:1;visibility:visible;transform:none}.route-dot{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--deep);border:1px solid var(--teal);color:var(--teal);z-index:1;font-family:var(--serif);font-size:20px}.route-step.open:last-child .route-dot{background:var(--teal);color:var(--ink)}.route-step strong{font-family:var(--serif);font-size:clamp(23px,2.2vw,32px);font-weight:500}.route-step span{display:block;color:var(--muted);margin-top:4px}
    .scanner{overflow:hidden;transform:rotate(0);width:min(450px,78%)}.scanner .beam{position:absolute;z-index:3;left:12px;right:12px;height:5px;top:20%;background:#68c7bd;box-shadow:0 0 18px 5px #68c7bd77;animation:scan 3.4s ease-in-out infinite}.scan-item{padding:9px 5px;border-left:3px solid transparent;opacity:0;visibility:hidden;transition:.35s}.scan-item.open{opacity:1;visibility:visible;border-color:var(--teal);background:#4f8d8816}.scan-item strong{display:block;font-family:var(--serif);font-size:18px}.scan-item span{font-size:13px;color:#655d50}@keyframes scan{50%{top:78%}}
    .choices{display:grid;gap:16px;width:min(760px,100%)}.choice{border:1px solid #ffffff29;background:#182c2e;color:var(--white);padding:24px 26px;text-align:left;border-radius:3px;cursor:pointer;min-height:92px;transition:.2s}.choice:hover,.choice:focus-visible{background:#213b3c;border-color:var(--bronze);transform:translateX(5px);outline:3px solid #e2b37655;outline-offset:3px}.choice strong{display:block;font:500 clamp(23px,2.4vw,34px)/1.15 var(--serif)}.choice span{display:block;color:var(--muted);margin-top:7px;font-size:15px}.choice:after{content:"→";float:right;color:var(--bronze);font-size:25px;margin-top:-32px}
    .object-card{width:min(560px,90%);padding:clamp(28px,4vw,54px);background:var(--paper);color:#202a28;box-shadow:var(--shadow);position:relative}.object-card:after{content:"";position:absolute;inset:13px;border:1px solid #7b67473d;pointer-events:none}.object-card .label{color:#755c3d;text-transform:uppercase;font-size:12px;letter-spacing:.18em}.object-card h3{font:500 clamp(30px,3.2vw,48px)/1.08 var(--serif);margin:18px 0}.object-card p{font-size:clamp(17px,1.5vw,22px);line-height:1.5}.object-card.success{border-top:7px solid var(--moss)}.object-card.warning{border-top:7px solid var(--earth)}.object-card.final{border-top:7px solid var(--bronze)}
    .tree{width:100%;max-width:920px;background:#0d191bc7;border:1px solid #ffffff1c;padding:clamp(20px,3vw,40px);font-size:clamp(14px,1.35vw,20px);line-height:1.45}.tree ul{list-style:none;padding-left:clamp(14px,2.2vw,32px);margin:7px 0;border-left:1px solid #ffffff2c}.tree li{margin:8px 0;position:relative}.tree li:before{content:"";position:absolute;left:calc(clamp(14px,2.2vw,32px)*-1);top:.75em;width:clamp(8px,1.4vw,20px);border-top:1px solid #ffffff2c}.tree>ul{border:0;padding-left:0}.tree>ul>li:before{display:none}.tree strong{color:var(--bronze);font-family:var(--serif);font-size:1.12em}.tree .good{color:#a8ba9a}.tree .stop{color:#cf8270}
    .controls{min-height:72px;border-top:1px solid #ffffff18;padding:10px clamp(20px,4vw,64px);display:flex;align-items:center;justify-content:space-between;gap:14px}.control-group{display:flex;gap:10px}.control{min-height:44px;border:1px solid #ffffff2a;background:transparent;color:var(--muted);padding:10px 16px;cursor:pointer;border-radius:2px}.control:hover,.control:focus-visible{color:white;border-color:var(--bronze);outline:2px solid #ddb07266;outline-offset:2px}.control.primary{background:var(--bronze);border-color:var(--bronze);color:#17201e;font-weight:800}.control[hidden]{display:none}.hint{color:#83908b;font-size:12px}
    .sr-live{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
    @media(max-width:900px){.topbar{height:64px}.progress-track{width:100px}.scene,.scene--wide{min-height:auto;grid-template-columns:1fr;padding:34px 28px 60px;gap:30px;align-content:start}.copy h1{font-size:clamp(42px,8vw,66px)}.copy h2{font-size:clamp(34px,6vw,52px)}.stage{min-height:390px}.choices{max-width:none}.controls{position:sticky;bottom:0;background:#101a1cf2;backdrop-filter:blur(8px);z-index:8}}
    @media(max-width:600px){.brand small,.hint,.progress span{display:none}.topbar{padding:0 16px}.progress-track{width:90px}.scene,.scene--wide{display:block;padding:28px 18px 46px}.copy h1{font-size:42px}.copy h2{font-size:36px;line-height:1.05}.copy p{font-size:20px}.stage{min-height:0;margin-top:32px;display:block}.desk{display:none}.document,.scanner{width:92%;margin:0 auto;min-height:390px;transform:none}.route{margin-top:30px}.route-step{grid-template-columns:44px 1fr}.route-dot{width:44px;height:44px}.choice{width:100%;padding:20px;min-height:96px}.choice strong{font-size:24px}.object-card{width:100%;margin:0}.tree{margin-top:30px;padding:18px 14px}.controls{padding:9px 14px}.control{padding:9px 13px}.control.primary{margin-left:auto}.scanner .beam{animation:none;top:54%}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
<div class="app">
  <header class="topbar"><div class="brand"><span class="brand-mark">J</span><span>JusLab Aula<small>Processo Civil</small></span></div><div class="progress"><span id="progressText">Abertura</span><div class="progress-track" aria-hidden="true"><div class="progress-fill" id="progressFill"></div></div></div></header>
  <main id="main" tabindex="-1"></main>
  <footer class="controls" aria-label="Controles da aula"><div class="control-group"><button class="control" id="back" type="button">← Voltar</button><button class="control" id="restart" type="button">Reiniciar</button></div><span class="hint">Prof. Flávio Marcelo Gomes · Aprender. Argumentar. Decidir.</span><button class="control primary" id="next" type="button">Continuar →</button></footer>
  <div class="sr-live" aria-live="polite" id="live"></div>
</div>
<script>
  // Um estado central governa cena, histórico e revelações persistentes.
  const state={node:'opening',history:[],reveals:{circulation:0,admissibility:0}};
  const main=document.querySelector('#main'),back=document.querySelector('#back'),next=document.querySelector('#next'),restart=document.querySelector('#restart');
  const nodes={
    opening:{label:'Abertura',next:'circulation',render:()=>layout(`<div class="copy"><div class="eyebrow">JusLab Aula · Procedimento comum</div><h1>Etapa liminar do procedimento comum</h1><p>Antes de o réu ser chamado, a petição circula, chega ao juiz e enfrenta decisões capazes de transformar o processo.</p><p class="legal-note">Acompanhe um ato por vez. Aqui, o processo — e não uma lista de slides — conduz a narrativa.</p></div>`,petition('Petição inicial','O processo começa com a demanda do autor.','PROTOCOLO'))},
    circulation:{label:'Circulação dos autos',revealMax:4,next:'transition',render:()=>layout(`<div class="copy"><div class="eyebrow">Dos autos ao gabinete</div><h2>A petição entra em circulação.</h2><p>Cada ato prepara o processo para a primeira atuação judicial.</p></div>`,route())},
    transition:{label:'Atuação judicial',next:'admissibility',render:()=>layout(`<div class="copy"><div class="eyebrow">Mudança de ambiência</div><h2>Os autos estão conclusos.</h2><p>A circulação dá lugar à atuação judicial. A petição agora é objeto de exame.</p><p class="legal-note">Conclusão é o encaminhamento dos autos ao juiz para a prática do ato jurisdicional.</p></div>`,`<div class="stage"><div class="desk"></div>${petition('Folha de conclusão','Faço estes autos conclusos ao juízo.','GABINETE')}</div>`,true)},
    admissibility:{label:'Juízo de admissibilidade',revealMax:5,next:'initialChoice',render:()=>layout(`<div class="copy"><div class="eyebrow">Leitura judicial</div><h2>Juízo de admissibilidade</h2><p>O juiz verifica se a demanda pode prosseguir e se a petição reúne os elementos exigidos.</p></div>`,scanner(),true)},
    initialChoice:{label:'Bifurcação inicial',choice:true,render:()=>layout(`<div class="copy"><div class="eyebrow">Primeira bifurcação</div><h2>O que o exame revela?</h2><p>O avanço agora depende da conclusão jurídica.</p></div>`,choices([['Petição inicial em termos','Os requisitos permitem o prosseguimento.','received'],['Faltam requisitos','A petição precisa ser corrigida, emendada ou aditada.','amendment']]),true)},
    received:{label:'Recebimento',next:'meritsChoice',render:()=>layout(`<div class="copy"><div class="eyebrow">Petição em termos</div><h2>O juiz recebe a petição inicial.</h2><p>Superado o primeiro exame, ainda resta verificar se o pedido pode ser julgado liminarmente.</p></div>`,object('Despacho','Petição inicial recebida','Prosseguimento sujeito ao exame do art. 332 do CPC.','success'),true)},
    amendment:{label:'Emenda',next:'correctionChoice',render:()=>layout(`<div class="copy"><div class="eyebrow">Faltam requisitos</div><h2>Intimação para corrigir.</h2><p>O juiz indica com precisão o que deve ser corrigido ou completado e concede prazo de <strong>15 dias</strong>.</p><p class="legal-note">Correção, emenda ou aditamento da petição inicial — art. 321 do CPC.</p></div>`,object('Despacho de emenda','Intime-se o autor','Prazo: 15 dias. A oportunidade de correção precede o indeferimento.','warning'),true)},
    correctionChoice:{label:'Resposta do autor',choice:true,render:()=>layout(`<div class="copy"><div class="eyebrow">Depois da intimação</div><h2>Como o autor responde?</h2><p>A conduta do autor define se o processo prossegue.</p></div>`,choices([['O autor corrige','A petição retorna completa ao exame judicial.','corrected'],['O autor não corrige','A falha permanece após a oportunidade concedida.','rejected']]),true)},
    corrected:{label:'Petição corrigida',next:'meritsChoiceCorrected',render:()=>layout(`<div class="copy"><div class="eyebrow">Correção realizada</div><h2>A petição corrigida é recebida.</h2><p>Com a deficiência sanada, o processo retorna ao mesmo ponto de controle: improcedência liminar ou citação.</p></div>`,object('Petição corrigida','Requisitos atendidos','O recebimento recoloca o pedido sob exame do art. 332 do CPC.','success'),true)},
    meritsChoice:{label:'Exame do pedido',choice:true,render:()=>meritsChoice()},
    meritsChoiceCorrected:{label:'Exame do pedido',choice:true,render:()=>meritsChoice()},
    rejected:{label:'Indeferimento',next:'summary',render:()=>outcome('Decisão','Petição inicial indeferida','Extinção sem resolução do mérito. O processo termina antes da citação.','warning')},
    earlyMerits:{label:'Improcedência liminar',next:'summary',render:()=>outcome('Sentença','Improcedência liminar do pedido','Sentença de mérito antes da citação: decadência, prescrição ou precedente vinculante contrário, nas hipóteses legais.','warning')},
    citation:{label:'Citação',next:'summary',render:()=>outcome('Prosseguimento','Citação do réu','Sem hipótese de improcedência liminar, o juiz determina a citação. Este é o ponto final da etapa estudada.','success')},
    summary:{label:'Síntese final',render:()=>layout(`<div class="copy"><div class="eyebrow">Mapa completo</div><h2>Síntese da etapa liminar</h2><p>Um exame, duas bifurcações e consequências distintas antes da citação.</p></div>`,tree(),true)}
  };
  function layout(copy,visual,wide=false){return `<section class="scene ${wide?'scene--wide':''}">${copy}${visual.startsWith('<div class="stage"')?visual:`<div class="stage"><div class="desk"></div>${visual}</div>`}</section>`}
  function petition(title,text,tag){return `<div class="document"><div class="doc-seal">${title}</div><p>${text}</p><div class="line"></div><div class="line"></div><div class="line short"></div><div class="line"></div><span class="paper-tag">${tag}</span></div>`}
  function route(){const items=[['1','Protocolo','A petição é apresentada ao Poder Judiciário.'],['2','Distribuição','O feito é direcionado ao juízo competente.'],['3','Autuação','Formam-se e identificam-se os autos.'],['4','Conclusão ao juiz','Os autos chegam para atuação judicial.']];return `<div class="route">${items.map((x,i)=>`<div class="route-step ${i<state.reveals.circulation?'open':''}"><span class="route-dot">${x[0]}</span><div><strong>${x[1]}</strong><span>${x[2]}</span></div></div>`).join('')}</div>`}
  function scanner(){const items=[['Partes e qualificação','Quem demanda e contra quem.'],['Fatos e fundamentos','A causa de pedir.'],['Pedido e valor da causa','A tutela pretendida e sua expressão econômica.'],['Documentos indispensáveis','O suporte documental necessário.'],['Condições e pressupostos','Legitimidade, interesse e pressupostos processuais.']];return `<div class="document scanner"><div class="beam" aria-hidden="true"></div>${items.map((x,i)=>`<div class="scan-item ${i<state.reveals.admissibility?'open':''}"><strong>${x[0]}</strong><span>${x[1]}</span></div>`).join('')}</div>`}
  function choices(items){return `<div class="choices" role="group" aria-label="Escolha jurídica">${items.map((x,i)=>`<button type="button" class="choice" data-go="${x[2]}"><strong>${x[0]}</strong><span>${x[1]}</span></button>`).join('')}</div>`}
  function object(label,title,text,kind){return `<article class="object-card ${kind}"><div class="label">${label}</div><h3>${title}</h3><p>${text}</p></article>`}
  function outcome(label,title,text,kind){return layout(`<div class="copy"><div class="eyebrow">Consequência jurídica</div><h2>${title}</h2><p>${text}</p></div>`,object(label,title,text,kind),true)}
  function meritsChoice(){return layout(`<div class="copy"><div class="eyebrow">Segunda bifurcação</div><h2>Há hipótese de improcedência liminar?</h2><p>O pedido pode ser decidido antes mesmo da citação, mas somente nas hipóteses legais.</p></div>`,choices([['Há hipótese','Decadência, prescrição ou precedente vinculante contrário.','earlyMerits'],['Não há hipótese','O contraditório deve ser instaurado com a citação.','citation']]),true)}
  function tree(){return `<div class="tree" aria-label="Fluxo completo da etapa liminar"><ul><li><strong>Juízo de admissibilidade</strong><ul><li>Petição em termos<ul><li>Recebimento<ul><li class="stop">Improcedência liminar</li><li class="good">Citação do réu</li></ul></li></ul></li><li>Faltam requisitos<ul><li>Intimação para corrigir — 15 dias<ul><li>Corrige<ul><li>Recebimento<ul><li class="stop">Improcedência liminar</li><li class="good">Citação do réu</li></ul></li></ul></li><li>Não corrige<ul><li class="stop">Indeferimento · extinção sem resolução do mérito</li></ul></li></ul></li></ul></li></ul></div>`}
  function go(id){state.history.push(state.node);state.node=id;render()}
  function advance(){const n=nodes[state.node];if(n.choice||!n.next)return;if(n.revealMax&&state.reveals[state.node]<n.revealMax){state.reveals[state.node]++;render(false);return}go(n.next)}
  function render(focus=true){const n=nodes[state.node];main.innerHTML=n.render();back.disabled=state.history.length===0;next.hidden=n.choice||!n.next;next.textContent=n.revealMax&&state.reveals[state.node]<n.revealMax?'Revelar →':state.node==='summary'?'':'Continuar →';const stages=['opening','circulation','transition','admissibility','initialChoice','received','amendment','correctionChoice','corrected','meritsChoice','meritsChoiceCorrected','rejected','earlyMerits','citation','summary'];const pct=Math.max(5,((stages.indexOf(state.node)+1)/stages.length)*100);document.querySelector('#progressFill').style.width=pct+'%';document.querySelector('#progressText').textContent=n.label;document.querySelector('#live').textContent='Cena: '+n.label;if(focus){main.focus({preventScroll:true});window.scrollTo({top:0,behavior:'auto'})}}
  main.addEventListener('click',e=>{const choice=e.target.closest('[data-go]');if(choice)go(choice.dataset.go)});
  next.addEventListener('click',advance);back.addEventListener('click',()=>{if(state.history.length){state.node=state.history.pop();render()}});restart.addEventListener('click',()=>{state.node='opening';state.history=[];state.reveals={circulation:0,admissibility:0};render()});
  document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'&&!nodes[state.node].choice){e.preventDefault();advance()}if(e.key==='ArrowLeft'&&state.history.length){e.preventDefault();state.node=state.history.pop();render()}});
  render();
</script>
</body>
</html>
