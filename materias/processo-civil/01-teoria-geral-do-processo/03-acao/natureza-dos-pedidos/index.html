<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b141b">
<title>JusLab Interativo — Natureza dos Pedidos</title>
<style>
:root{--bg:#0b141b;--bg2:#111f29;--paper:#f2eee5;--ink:#1e2529;--teal:#67a9a6;--teal2:#8bc4bd;--clay:#a96657;--white:#f7f9f8;--serif:"Source Serif 4","Iowan Old Style",Georgia,serif;--sans:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--white);font-family:var(--sans)}body{background:radial-gradient(circle at 14% 18%,#67a9a61a,transparent 30%),radial-gradient(circle at 82% 76%,#b38a5d14,transparent 34%),linear-gradient(145deg,var(--bg),var(--bg2) 52%,#0d171e);overflow-x:hidden}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.2;background-image:linear-gradient(#ffffff05 1px,transparent 1px),linear-gradient(90deg,#ffffff05 1px,transparent 1px);background-size:42px 42px}.app{min-height:100svh;display:grid;grid-template-rows:auto 1fr auto}.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:18px clamp(18px,4vw,56px);border-bottom:1px solid #ffffff16;background:#081016b8;backdrop-filter:blur(14px)}.brand,.sign{display:flex;align-items:center;gap:12px;text-transform:uppercase;font-size:.74rem;font-weight:850;letter-spacing:.12em}.mark{width:17px;height:34px;position:relative;flex:none}.mark:before,.mark:after{content:"";position:absolute;left:2px;right:2px;height:5px;background:var(--teal)}.mark:before{top:1px}.mark:after{bottom:1px}.mark i{position:absolute;left:6px;top:6px;bottom:6px;width:5px;background:var(--teal)}.progress{display:flex;align-items:center;gap:13px;min-width:min(43vw,480px)}.progress span{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:#cbd4d2;white-space:nowrap}.track{height:4px;flex:1;background:#ffffff21;border-radius:99px;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--teal2));transition:.5s}.stage{width:min(1320px,100%);margin:auto;padding:clamp(24px,4vw,56px);display:grid;align-items:center}.scene{display:grid;grid-template-columns:minmax(0,1.02fr) minmax(380px,.98fr);gap:clamp(24px,4vw,64px);align-items:center;animation:enter .5s ease}.scene.single{grid-template-columns:1fr}.eyebrow{display:flex;align-items:center;gap:10px;color:var(--teal2);font-weight:850;text-transform:uppercase;font-size:.76rem;letter-spacing:.15em;margin-bottom:16px}.eyebrow:before{content:"";width:34px;height:1px;background:var(--teal)}h1,h2{font-family:var(--serif);font-weight:600;line-height:.98;letter-spacing:-.03em;text-wrap:balance;margin:0 0 20px}h1{font-size:clamp(3rem,7vw,6.8rem)}h2{font-size:clamp(2.35rem,5.2vw,5.15rem)}.lead{font-size:clamp(1.12rem,1.7vw,1.5rem);line-height:1.58;color:#d7dfdd;max-width:740px}.verbs{display:flex;flex-wrap:wrap;gap:10px;margin:26px 0}.pill{border:1px solid #ffffff24;padding:10px 14px;border-radius:99px;font-size:.78rem;font-weight:850;letter-spacing:.09em;text-transform:uppercase}.paper{background:linear-gradient(90deg,#7864460d,transparent 7%,transparent 93%,#78644609),var(--paper);color:var(--ink);border-radius:22px;box-shadow:0 28px 70px #0000006b;min-height:560px;padding:clamp(28px,4vw,54px);position:relative;overflow:hidden;transform:rotate(.2deg)}.paper:before{content:"";position:absolute;inset:14px;border:1px solid #1e252917;border-radius:14px;pointer-events:none}.file{font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:#596368;font-weight:850;margin-bottom:24px}.client{font-family:var(--serif);font-size:clamp(2rem,3.4vw,3.1rem);line-height:1;margin-bottom:18px}.case{font-size:clamp(1rem,1.38vw,1.22rem);line-height:1.65;color:#343c40}.question{margin-top:26px;padding-top:20px;border-top:1px solid #1e25292b;font-weight:850;font-size:clamp(1.05rem,1.5vw,1.25rem);line-height:1.35}.choices{display:grid;gap:10px;margin-top:14px}.choice{width:100%;text-align:left;border:0;border-top:1px solid #1e252930;background:transparent;color:var(--ink);padding:15px 6px 12px;cursor:pointer;display:grid;grid-template-columns:32px 1fr;gap:12px;align-items:start;transition:.2s}.choice:last-child{border-bottom:1px solid #1e252930}.choice:hover{background:#67a9a617;transform:translateX(4px)}.choice:disabled{cursor:default}.letter{width:27px;height:27px;border:1px solid #1e252959;border-radius:50%;display:grid;place-items:center;font-size:.78rem;font-weight:900}.choice.ok{background:#67a9a624;color:#183f3e}.choice.ok .letter{background:#2c7773;color:#fff;border-color:#2c7773}.choice.no{background:#a966571f;color:#6e3025}.choice.no .letter{background:#985243;color:#fff;border-color:#985243}.feedback{display:none;margin-top:20px;border-left:4px solid var(--teal);padding:14px 17px;background:#67a9a619}.feedback.show{display:block;animation:enter .35s}.feedback.no{border-left-color:var(--clay);background:#a9665719}.feedback strong{display:block;font-family:var(--serif);font-size:1.5rem;margin-bottom:6px}.feedback p{margin:0;color:#344045;line-height:1.52}.class{display:none;margin-top:20px;padding:18px 19px;background:#16262d;color:#fff;border-radius:14px}.class.show{display:block;animation:enter .35s}.kicker{font-size:.68rem;text-transform:uppercase;letter-spacing:.15em;color:var(--teal2);font-weight:900;margin-bottom:7px}.class h3{font-family:var(--serif);font-size:clamp(1.6rem,2.6vw,2.4rem);line-height:1.05;margin:0}.class p{font-size:.92rem;line-height:1.5;color:#ccd7d4;margin:8px 0 0}.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px}.btn{border:0;border-radius:99px;padding:13px 20px;cursor:pointer;font-weight:850;background:var(--teal2);color:#102429;transition:.2s}.btn:hover{transform:translateY(-2px);filter:brightness(1.05)}.nav{display:flex;justify-content:space-between;align-items:center;padding:14px clamp(18px,4vw,56px) 20px;color:#aeb8b6;font-size:.75rem;text-transform:uppercase;letter-spacing:.08em}.nav button{background:none;border:0;color:#aeb8b6;cursor:pointer;text-transform:uppercase;letter-spacing:.08em}.nav button:disabled{opacity:.28;cursor:default}.seal{width:min(430px,72vw);aspect-ratio:1;display:grid;place-items:center;margin:auto;border:1px solid #ffffff25;border-radius:50%;position:relative;background:radial-gradient(circle,#67a9a61f,transparent 64%)}.seal:before,.seal:after{content:"";position:absolute;border-radius:50%;border:1px solid #ffffff12}.seal:before{inset:9%}.seal:after{inset:19%}.seal div{text-align:center;z-index:1}.seal strong{display:block;font-family:var(--serif);font-size:clamp(1.7rem,4vw,3.3rem);font-weight:600}.seal span{display:block;color:var(--teal2);font-size:.75rem;text-transform:uppercase;letter-spacing:.14em;margin-top:10px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-top:24px}.card{padding:20px;border:1px solid #ffffff20;border-radius:18px;background:#ffffff09}.card b{color:var(--teal2);font-size:.74rem;letter-spacing:.12em;text-transform:uppercase}.card h3{font-family:var(--serif);font-size:2rem;margin:10px 0}.card p{color:#c8d2d0;line-height:1.52}.quote{margin-top:24px;padding-top:20px;border-top:1px solid #ffffff23;font-family:var(--serif);font-size:clamp(1.5rem,2.7vw,2.4rem);line-height:1.18}.sign{margin-top:27px;color:#c8d2d0}.sign .mark{transform:scale(.72);transform-origin:left center}details{margin-top:20px;border-top:1px solid #ffffff22;border-bottom:1px solid #ffffff22;padding:15px 0;color:#d6dddb}summary{cursor:pointer;font-weight:850}details p{color:#bfc8c6;line-height:1.6}.hidden{display:none!important}@keyframes enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media(max-width:930px){.top{padding:14px 18px}.brand span{max-width:210px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.progress{min-width:0;flex:1}.progress>span{display:none}.stage{padding:26px 18px 34px}.scene{grid-template-columns:1fr;align-items:start}.paper{order:2;min-height:0;transform:none}.copy{order:1}.summary{grid-template-columns:1fr}.nav{padding:12px 18px 18px}}
@media(max-width:620px){h1{font-size:clamp(2.8rem,15vw,4.7rem)}h2{font-size:clamp(2.35rem,12vw,3.7rem)}.lead{font-size:1.06rem}.brand{font-size:.65rem}.brand span{max-width:155px}.paper{padding:30px 22px;border-radius:16px}.paper:before{inset:9px}.case{font-size:1rem}.actions .btn{width:100%}.nav span{display:none}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand"><div class="mark"><i></i></div><span>JusLab Ensino · Experiência Interativa</span></div><div class="progress"><span id="label">Abertura</span><div class="track"><div class="bar" id="bar"></div></div></div></header>
<main class="stage" id="stage"></main>
<footer class="nav"><button id="prev">← Voltar</button><span>JusLab Ensino · Modo Aula e Estudo</span><button id="next">Avançar →</button></footer>
</div>
<script>
const cases=[
{label:"Atendimento 1 de 5",title:"Uma dívida que não existe",lead:"A necessidade é eliminar uma incerteza jurídica.",client:"Marina",text:"Marina recebeu uma cobrança de <strong>R$ 18.400,00</strong> referente a empréstimo que afirma nunca ter celebrado. Não reconhece a assinatura, não recebeu o valor e, neste momento, não pede indenização: deseja apenas que o Judiciário reconheça que a dívida não existe.",question:"O que Marina necessita que o Judiciário faça?",options:["Reconheça juridicamente uma situação que já existe.","Extinga uma relação jurídica válida.","Condene a instituição a cumprir uma prestação."],answer:0,good:"Marina pretende eliminar uma incerteza: a instituição afirma que existe dívida; ela sustenta que não existe. O Judiciário apenas reconhecerá essa realidade jurídica.",bad:"Marina não pede a extinção de contrato válido nem exige uma prestação. O resultado pretendido é a certeza sobre a inexistência do débito.",nature:"Pedido declaratório negativo",note:"O Judiciário confere certeza sobre a inexistência do débito."},
{label:"Atendimento 2 de 5",title:"Um vínculo que precisa terminar",lead:"A decisão altera o estado jurídico anterior.",client:"Joana",text:"Joana e Marcos estão separados de fato há três anos. Ela pretende encerrar definitivamente o vínculo matrimonial e passar juridicamente à condição de divorciada. Não formulará pedidos de alimentos, indenização ou partilha.",question:"O que Joana necessita que o Judiciário faça?",options:["Apenas reconheça uma situação jurídica anterior.","Extinga o vínculo matrimonial e modifique seu estado civil.","Condene Marcos ao cumprimento de uma prestação."],answer:1,good:"Antes da decisão, Joana permanece casada. Com o divórcio, o vínculo matrimonial é extinto e surge o estado jurídico de divorciada.",bad:"A decisão transforma a realidade jurídica anterior. Ela não se limita a reconhecer um fato nem impõe uma prestação a Marcos.",nature:"Pedido constitutivo negativo",note:"A decisão extingue o casamento e constitui o estado jurídico de divorciada."},
{label:"Atendimento 3 de 5",title:"O muro danificado",lead:"O reconhecimento do direito, sozinho, não resolve o problema.",client:"André",text:"Durante uma obra, a empresa ConstruLar danificou o muro da residência de André. A empresa recusa o reparo. André pretende que ela seja obrigada a <strong>reconstruir o muro</strong> e a <strong>pagar os prejuízos</strong> causados pela infiltração.",question:"O que André necessita que o Judiciário faça?",options:["Apenas declare quem é o proprietário do muro.","Crie ou extinga uma relação jurídica.","Imponha à empresa obrigações de fazer e de pagar."],answer:2,good:"André precisa que a empresa realize uma conduta concreta e pague os prejuízos; a decisão poderá ser executada.",bad:"O problema não se resolve com uma simples declaração. André precisa obter comportamentos concretos da empresa.",nature:"Pedido condenatório",note:"Fazer: reconstruir o muro · Pagar: indenizar os prejuízos."},
{label:"Atendimento 4 de 5",title:"O mesmo contrato, três necessidades",lead:"O assunto do processo não define, sozinho, a natureza do pedido.",client:"Contrato de manutenção",text:"As partes discutem uma cláusula sobre “despesas estruturais”. O cliente quer saber se a troca do telhado está abrangida; em outra hipótese, deseja desfazer o contrato; em uma terceira, pretende manter o vínculo e exigir os reparos.",question:"Associe a sequência correta às três necessidades.",options:["Condenatório · declaratório · constitutivo.","Declaratório · constitutivo · condenatório.","Constitutivo · condenatório · declaratório."],answer:1,good:"Interpretar confere certeza; extinguir transforma a relação; exigir o cumprimento impõe uma prestação.",bad:"Observe a ordem: esclarecer a cláusula; extinguir o vínculo; exigir o cumprimento.",nature:"Interpretar · Extinguir · Exigir",note:"Declaratório · Constitutivo · Condenatório."},
{label:"Atendimento 5 de 5",title:"Paternidade e alimentos",lead:"Uma única ação pode reunir pedidos de naturezas diferentes.",client:"Isabela",text:"Representada por sua mãe, Isabela ajuíza ação contra Carlos. Pretende obter o reconhecimento de que ele é seu pai biológico e a determinação de que pague pensão alimentícia.",question:"A ação apresenta apenas uma natureza de pedido?",options:["Sim. Todos os pedidos são declaratórios.","Sim. Todos os pedidos são condenatórios.","Não. Existem pedidos de naturezas diferentes."],answer:2,good:"O reconhecimento da paternidade confere certeza sobre uma relação preexistente. Os alimentos exigem uma prestação periódica de pagar.",bad:"A natureza deve ser examinada pedido por pedido. Os dois resultados não produzem o mesmo efeito jurídico.",nature:"Declaratório + condenatório",note:"Paternidade: declaratório · Alimentos: condenatório."},
{label:"Síntese",title:"Qual é o critério decisivo?",lead:"Formule a regra que permite classificar qualquer pedido.",client:"Complete o critério",text:"O mesmo fato pode gerar pedidos diferentes. Uma única ação também pode reunir pedidos declaratórios, constitutivos e condenatórios.",question:"A natureza do pedido é determinada principalmente...",options:["Pelo nome tradicional atribuído à ação.","Pelo assunto discutido no processo.","Pelo efeito jurídico que o autor pretende obter com a decisão."],answer:2,good:"A classificação depende do efeito jurídico pretendido: reconhecer, transformar ou impor uma prestação.",bad:"O nome da ação e o assunto contextualizam o conflito, mas não substituem a análise do resultado jurídico pretendido.",nature:"Observe o efeito jurídico pretendido",note:"Esse é o critério de diagnóstico."}
];
const stage=document.querySelector("#stage"),bar=document.querySelector("#bar"),label=document.querySelector("#label"),prev=document.querySelector("#prev"),next=document.querySelector("#next");let current=0,done=Array(cases.length).fill(false);
const mark='<div class="mark"><i></i></div>';
function opening(){return `<section class="scene"><div class="copy"><div class="eyebrow">Processo Civil · Teoria Geral do Processo</div><h1>O que o Judiciário precisa fazer?</h1><p class="lead">Cinco pessoas aguardam atendimento. Elas não conhecem o nome jurídico de seus pedidos — sabem apenas qual problema precisa ser resolvido.</p><div class="verbs"><span class="pill">Reconhecer</span><span class="pill">Transformar</span><span class="pill">Impor uma prestação</span></div><div class="actions"><button class="btn" data-go="1">Iniciar a triagem</button></div></div><div class="seal"><div><strong>Natureza<br>dos pedidos</strong><span>Diagnóstico jurídico</span></div></div></section>`}
function activity(i){const c=cases[i-1];return `<section class="scene"><div class="copy"><div class="eyebrow">${c.label}</div><h2>${c.title}</h2><p class="lead">${c.lead}</p></div><article class="paper"><div class="file">Ficha jurídica · ${String(i).padStart(2,"0")}</div><div class="client">${c.client}</div><p class="case">${c.text}</p><div class="question">${c.question}</div><div class="choices">${c.options.map((o,n)=>`<button class="choice" data-choice="${n}"><span class="letter">${"ABC"[n]}</span><span>${o}</span></button>`).join("")}</div><div class="feedback"><strong></strong><p></p></div><div class="class"><div class="kicker">Natureza revelada</div><h3>${c.nature}</h3><p>${c.note}</p></div><div class="actions"><button class="btn hidden" data-go="${i+1}">${i===cases.length?"Concluir experiência":"Próxima etapa"}</button></div></article></section>`}
function final(){return `<section class="scene"><div class="copy"><div class="eyebrow">Diagnóstico concluído</div><h2>Três necessidades.<br>Três naturezas.</h2><div class="summary"><div class="card"><b>Reconhecer</b><h3>Declaratório</h3><p>Confere certeza sobre existência, inexistência ou modo de ser de uma relação jurídica, ou sobre documento.</p></div><div class="card"><b>Transformar</b><h3>Constitutivo</h3><p>Cria, modifica ou extingue uma situação ou relação jurídica.</p></div><div class="card"><b>Impor</b><h3>Condenatório</h3><p>Determina que o réu pague, entregue, faça ou deixe de fazer alguma coisa.</p></div></div><div class="quote">Antes de classificar o pedido, identifique o resultado que a decisão deverá produzir.</div><details><summary>Aprofundamento: eficácia temporal</summary><p>Pedidos declaratórios costumam ser associados à eficácia ex tunc; pedidos constitutivos, em regra, à eficácia ex nunc. Nos condenatórios, o termo inicial de efeitos patrimoniais depende da relação material e da regra aplicável. A eficácia temporal não deve ser o primeiro critério de classificação.</p></details><div class="sign">${mark}<span>Prof. Flávio Marcelo Gomes</span></div><div class="actions"><button class="btn" id="restart">Reiniciar experiência</button></div></div><div class="seal"><div><strong>Reconhecer<br>Transformar<br>Impor</strong><span>Natureza dos pedidos</span></div></div></section>`}
function render(){stage.innerHTML=current===0?opening():current<=cases.length?activity(current):final();label.textContent=current===0?"Abertura":current<=cases.length?cases[current-1].label:"Conclusão";bar.style.width=`${current/(cases.length+1)*100}%`;prev.disabled=current===0;next.disabled=current===cases.length+1||(current>0&&current<=cases.length&&!done[current-1]);next.classList.toggle("hidden",current===cases.length+1);stage.scrollIntoView({behavior:"smooth",block:"start"});if(current>0&&current<=cases.length&&done[current-1])reveal(current-1)}
function reveal(i){const box=stage.querySelector(".choices"),fb=stage.querySelector(".feedback"),cl=stage.querySelector(".class"),go=stage.querySelector("[data-go]");if(!box)return;box.querySelectorAll("button").forEach((b,n)=>{b.disabled=true;if(n===cases[i].answer)b.classList.add("ok")});fb.classList.add("show");fb.querySelector("strong").textContent="Ótima escolha.";fb.querySelector("p").textContent=cases[i].good;cl.classList.add("show");go.classList.remove("hidden")}
document.addEventListener("click",e=>{const go=e.target.closest("[data-go]");if(go){current=+go.dataset.go;render();return}const choice=e.target.closest("[data-choice]");if(choice){const c=cases[current-1],selected=+choice.dataset.choice,fb=stage.querySelector(".feedback"),cl=stage.querySelector(".class");stage.querySelectorAll(".choice").forEach(b=>b.classList.remove("ok","no"));if(selected===c.answer){done[current-1]=true;reveal(current-1);next.disabled=false}else{choice.classList.add("no");fb.className="feedback show no";fb.querySelector("strong").textContent="Reflita melhor.";fb.querySelector("p").textContent=c.bad;cl.classList.remove("show")}}if(e.target.id==="restart"){done.fill(false);current=0;render()}});
prev.onclick=()=>{if(current>0){current--;render()}};next.onclick=()=>{if(!next.disabled){current++;render()}};document.addEventListener("keydown",e=>{if(e.key==="ArrowLeft"&&current>0){current--;render()}if((e.key==="ArrowRight"||e.key==="Enter")&&!next.disabled){current++;render()}});render();
</script>
</body>
</html>
